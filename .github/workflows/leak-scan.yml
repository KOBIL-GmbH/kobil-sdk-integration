name: leak-scan
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For pull requests scan the branch itself, not the merge commit GitHub builds for the check.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan history for person, source-code and ticket references
        env:
          # Regular expression of names to block; kept in a repository/organization variable, not in the repo.
          FORBIDDEN_NAMES: ${{ vars.FORBIDDEN_NAMES }}
        run: python3 scripts/leak_scan.py . HEAD
