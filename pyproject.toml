[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobil-sdk-integration"
version = "0.9.0"
description = "Modular KOBIL SDK integration planning for native and Flutter apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.27,<1", "keyring>=25,<26", "cryptography>=43,<51", "paramiko>=3.5,<5"]

[project.optional-dependencies]
sentry = [
    "sentry-sdk>=2,<3",
]

[project.urls]
Repository = "https://github.com/KOBIL-GmbH/kobil-sdk-integration"

[project.scripts]
kobil-sdk-credentials = "kobil_sdk_integration.credential_cli:main"
kobil-sdk-mcp = "kobil_sdk_integration.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kobil_sdk_integration = ["modules.json", "service_routes.json", "knowledge/*.json", "knowledge/*.md", "knowledge/code_samples/*/*", "knowledge/code_samples/index.json", "bundles/*.age"]
